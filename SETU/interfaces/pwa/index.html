<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SETU — Offline Translation</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="icon.svg" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, sans-serif;
      background: #0f172a; color: #e2e8f0; display: flex; justify-content: center;
    }
    main { width: 100%; max-width: 640px; padding: 24px 16px 40px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h1 span { color: #38bdf8; }
    .sub { color: #94a3b8; font-size: .85rem; margin: 0 0 20px; }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    select, textarea, button {
      font: inherit; border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #e2e8f0; padding: 10px 12px;
    }
    select { flex: 1; }
    .swap { flex: 0 0 auto; cursor: pointer; background: #334155; border: none; padding: 10px 14px; }
    textarea { width: 100%; min-height: 120px; resize: vertical; }
    button.primary {
      width: 100%; margin-top: 12px; background: #38bdf8; color: #0f172a;
      font-weight: 700; border: none; cursor: pointer; padding: 14px;
    }
    button.primary:disabled { opacity: .5; cursor: default; }
    .out { margin-top: 16px; padding: 14px; border-radius: 10px; background: #1e293b;
           min-height: 60px; white-space: pre-wrap; }
    .meta { margin-top: 8px; font-size: .75rem; color: #64748b; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px;
             font-size: .7rem; background: #334155; }
    .offline { background: #7c2d12; color: #fed7aa; }
  </style>
</head>
<body>
  <main>
    <h1>से<span>तु</span> · SETU</h1>
    <p class="sub">Offline translation · 22 scheduled Indian languages
      <span id="conn" class="badge">checking…</span></p>

    <div class="row">
      <select id="src" aria-label="Source language"></select>
      <button class="swap" id="swap" title="Swap languages" aria-label="Swap">⇄</button>
      <select id="tgt" aria-label="Target language"></select>
    </div>

    <textarea id="input" placeholder="Enter text to translate…"></textarea>
    <button class="primary" id="go">Translate</button>

    <div class="out" id="output" aria-live="polite"></div>
    <div class="meta" id="meta"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
