# GPU training hyperparameters (Kaggle T4/P100). Copy over training.yaml on GPU:
#   cp configs/training.gpu.yaml configs/training.yaml

seed: 42

sft:
  epochs: 10
  lr: 5.0e-4
  # batch 32 fits a 15 GB T4: the [batch, seq, 32k-vocab] logits + backward
  # dominate memory. Raise toward 64 on a bigger GPU (A100/40GB).
  batch_size: 32
  warmup_steps: 4000
  device: auto          # -> cuda when available

dpo:
  beta: 0.1
  lr: 5.0e-6
  epochs: 1
  # DPO holds policy + frozen reference and does 4 forward passes/step, so it
  # needs a smaller batch than SFT.
  batch_size: 16
  reference_checkpoint: null
  device: auto

aio_kd:
  enabled: false
  directions: []
  cross_lingual_balancing: temperature
  sampling_temperature: 1.5

ewc:
  enabled: false
  fisher_samples: 1000
  lambda: 0.4
