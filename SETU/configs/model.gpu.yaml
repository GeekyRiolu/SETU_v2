# Full-size student for GPU training (Kaggle T4/P100, Colab).
# Copy over configs/model.yaml on a GPU box:  cp configs/model.gpu.yaml configs/model.yaml
#
# ~52M params (d=512, 6+6 layers). INT8 lands ~55 MB (still << 200 MB target).
# Too big for the 7.4 GB CPU box (swaps), fine on a 16 GB GPU.

language_pair: hin_Deva-eng_Latn

params:
  architecture: transformer
  encoder_layers: 6
  decoder_layers: 6
  hidden_size: 512
  ffn_size: 2048
  attention_heads: 8
  # 16k concentrates learning for a ~25-50k-sentence run (32k left most tokens
  # undertrained -> degenerate decoding). Raise toward 32k only with a much
  # larger corpus.
  vocab_size: 16000
  max_seq_len: 256
  dropout: 0.2          # more regularisation — the corpus is small vs. the model

quantization:
  mode: none
  format: onnx
