[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setu"
version = "0.1.0"
description = "SETU — offline multilingual translation for the 22 scheduled Indian languages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
data = [
    "datasets>=3.0",
]
prefs = [
    "scikit-learn>=1.4",  # char n-gram TF-IDF kNN for candidate retrieval
]
quantize = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "optimum[onnxruntime]>=1.20",
]
comet = [
    "unbabel-comet>=2.2",   # learned MT metric for setu-eval --comet (heavy; GPU recommended)
]
teacher = [
    # install torch from https://download.pytorch.org/whl/cpu on CPU-only boxes
    "torch>=2.6",
    # <4.54: the IndicTrans2 remote modeling code uses the legacy tuple
    # past_key_values API that transformers removed in 4.54
    "transformers>=4.42,<4.54",
    "sacrebleu>=2.3",
    "sentencepiece>=0.2",
    "einops",  # needed by the rotary-indictrans2 remote modeling code
    "IndicTransToolkit>=1.1",  # postprocess_batch(num_return_sequences=...) needed
]

[project.scripts]
setu = "setu.cli:main"
setu-data = "setu.corpus.pipeline:main"
setu-prefs = "setu.preference.pipeline:main"
setu-distill = "setu.distill.pipeline:main"
setu-train = "setu.training.pipeline:main"
setu-quantize = "setu.quantize.pipeline:main"
setu-eval = "setu.eval.cli:main"
setu-report = "setu.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
