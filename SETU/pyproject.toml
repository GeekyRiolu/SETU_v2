[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setu"
version = "0.1.0"
description = "SETU — offline multilingual translation for the 22 scheduled Indian languages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
data = [
    "datasets>=3.0",
]

[project.scripts]
setu = "setu.cli:main"
setu-data = "setu.corpus.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
